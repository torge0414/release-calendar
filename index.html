<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Calendar</title>
<script>/* 主题预载(防闪烁): 存过偏好用偏好, 否则跟随系统 */
try{var _t=localStorage.getItem('glwTheme');
if((_t==='dark')||(!_t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
}catch(e){}</script>
<style>
  /* 桌面中文标题用的思源宋体 Bold 子集（常用 3755 字 + 当前标题用字）。
     排在 Songti SC 之后：Mac 用系统宋体，不下载；Windows 没有带真粗体的中文衬线体，才会加载它。 */
  @font-face{font-family:"RC Title Serif SC"; src:url("fonts/title-serif-sc-bold.woff2") format("woff2");
       font-weight:700; font-style:normal; font-display:swap;
       unicode-range:U+00B7,U+2014,U+2026,U+3000-303F,U+4E00-9FFF,U+FF00-FFEF;}

  /* ---------- 主题变量 ---------- */
  :root{
    --bg:#eef0f3; --txt:#1c1d21; --sub:#444c59; --dim:#606772; --acc:#1c1d21;
    --line:rgba(28,29,33,.14);
    --today:#8a5200; --soon:#36598a;
    --score-good:#1d6a43; --score-mid:#a86b14; --score-low:#a3333b;
    --score-good-hover:#124c2e; --score-mid-hover:#7a4b08; --score-low-hover:#7c2028;
    --pic-bg:#e4e6ea; --spin:#c8ccd2; --switch-bg:#e3e4e8; --switch-bg-hover:#d6d8de;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --serif:Georgia,"Times New Roman","Songti SC","RC Title Serif SC","SimSun",serif;
    --work-title-font:var(--serif);
    --content-gap:6px;
    /* 评分使用默认齐线的衬线数字，避免 Georgia 旧式数字高低不齐 */
    --score-serif:"Times New Roman",Times,"Liberation Serif","Noto Serif",serif;
    --score-digit-width:0.56em;
    --theme-duration:.22s;
  }
  html.dark{
    --bg:#101114; --txt:#f4f5f6; --sub:#c5ccd6; --dim:#a3aab4; --acc:#f4f5f6;
    --line:rgba(255,255,255,.14);
    --today:#e8b764; --soon:#9cb7de;
    --score-good:#72c698; --score-mid:#d49d48; --score-low:#ef9398;
    --score-good-hover:#9ae3bb; --score-mid-hover:#f1c06f; --score-low-hover:#ffb4bc;
    --pic-bg:#1a1c21; --spin:#4a4c54; --switch-bg:#2c2e33; --switch-bg-hover:#383a40;
  }

  /* ---------- 基础 ---------- */
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); min-width:320px;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased; padding:26px 20px 44px; overflow-x:hidden;
    font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;
  }
  .wrap{max-width:860px; margin:0 auto; position:relative;}
  /* WebKit 会给继承中的 color 再做过渡；文字直接取主题色，容器不重复渐变 */
  h1,.mh .mn,.txt .tline .t{color:var(--txt);}
  :where(body,.t,.credit,h1,.tab,.err,.when,.mh .mn,.fine,.mline,.pfoot,.empty,.loading){
    transition:background-color var(--theme-duration) ease, color var(--theme-duration) ease, border-color var(--theme-duration) ease;
  }
  :where(.pic,.tabs){
    transition:background-color var(--theme-duration) ease, border-color var(--theme-duration) ease;
  }
  button:focus-visible,a:focus-visible{outline:2px solid var(--txt); outline-offset:3px;}

  /* ---------- 启动遮罩、加载与错误 ---------- */
  /* 数据就位前盖住整页, 所有布局变化都发生在遮罩下(刷新时看不到元素移动) */
  #boot{position:fixed; inset:0; background:var(--bg); z-index:99; display:flex;
       align-items:center; justify-content:center; transition:opacity .35s ease;}
  #boot.hide{opacity:0; pointer-events:none;}
  #boot .spin{display:inline-block; width:26px; height:26px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  .loading{color:var(--dim); font-size:14px; text-align:center; padding:52px 0;}
  .loading .spin{display:inline-block; width:22px; height:22px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .err{background:#fff2f0; border:1px solid #ffd7d2; color:#c0422a; padding:11px 16px;
       border-radius:12px; font-size:13px; margin-top:14px; display:none; text-align:center;}
  html.dark .err{background:#361d1a; border-color:#6b322c; color:#ffb4a6;}
  .empty{color:var(--dim); font-size:14px; padding:18px 8px; text-align:center;}

  /* ---------- 页头：字标与主题开关 ---------- */
  header{text-align:left; padding:2px 0 0;}
  .mast{position:relative;}
  .mast-top{display:flex; align-items:center; justify-content:space-between; margin:0 0 18px;}
  /* 字标：Georgia 斜体 22px 常规字重。大小落在页签（14px）和作品标题（26px）之间，不和 72px 月份数字抢；
     斜体和正体粗衬线的作品标题区分开。行高等于主题开关高度 31px，两者垂直居中对齐。 */
  h1{font-family:var(--serif);
     font-size:22px; font-style:italic; font-weight:400; letter-spacing:0; line-height:31px;
     white-space:nowrap; padding:0; position:relative; top:.05em;}   /* 斜体字形中心略高，下移约 1px 与开关居中（Windows Georgia 实测） */
  .theme-btn{
    position:relative; margin:0; flex:none;
    display:block; width:54px; height:31px; border-radius:999px;
    border:0; cursor:pointer; background:var(--switch-bg); padding:0;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1px 2px rgba(0,0,0,.06);
    transition:background-color var(--theme-duration) ease; z-index:5;
  }
  /* 悬停只加深底色，和全站「悬停只变色」一致 */
  .theme-btn:hover{background:var(--switch-bg-hover);}
  .theme-btn .tb-knob{
    position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    transition:left .35s cubic-bezier(.4,0,.2,1), background-color var(--theme-duration) ease;
  }
  /* 夜间主题旋钮用深色, 与浅色主题的白旋钮区分开(否则两个主题下都是白圆点) */
  html.dark .theme-btn .tb-knob{left:25px; background:#565661;
       box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.08);}
  /* 旋钮内嵌太阳/月亮矢量图标, 旋转交叉过渡 */
  .tb-ic{position:absolute; width:15px; height:15px; fill:none; stroke:currentColor;
       stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
       transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;}
  .tb-ic-sun{color:#d18a1d;}
  /* 月亮只在夜间主题可见(深色旋钮上), 用浅蓝灰保证对比度 */
  .tb-ic-moon{color:#d6ddf2; opacity:0; transform:rotate(-90deg) scale(.4);}
  html.dark .tb-ic-sun{opacity:0; transform:rotate(90deg) scale(.4);}
  html.dark .tb-ic-moon{opacity:1; transform:rotate(0) scale(1);}

  /* ---------- 页头：月份数字、类别和月份页签 ---------- */
  .mh{display:flex; align-items:baseline; gap:16px; margin:0 0 2px; flex-wrap:wrap;
      font-family:var(--serif);}
  .mh .mn{font-size:72px; font-weight:700; letter-spacing:-.03em; line-height:.8; font-family:var(--serif);}
  /* 类别页签和月份页签之间只留空白、不画横线，把月份页签推到右侧（2026-10-14 起不显示更新时间） */
  .mh .gap{flex:1 1 32px; min-width:24px;}
  /* 页签只有两三个，不做横向滚动。不能设 overflow：页签 ::after 扩出的点击区会被裁掉，
     还会被算成可滚动宽度，切到最后一个页签时整组被滚走、第一个页签被裁（2026-10-14 修过）。 */
  .tabs{display:flex; width:max-content; max-width:100%; margin:0; background:transparent;
       border-radius:0; padding:0; gap:14px; position:relative; overflow:visible;
       box-shadow:none; flex:none; align-items:baseline;}
  .tab{
    position:relative; z-index:1; border:0; background:transparent; cursor:pointer; font-family:var(--sans);
    font-size:14px; font-weight:500; color:var(--dim); padding:0 0 2px; flex:none; white-space:nowrap;
    border-radius:0; transition:color var(--theme-duration) ease;
  }
  .tab:hover{color:var(--txt);}
  .tab.on{color:var(--txt); font-weight:600;}
  /* 类别和月份使用相同的文字页签与共享下划线；类别下划线不滑动 */
  .tabg{display:block; position:absolute; left:0; bottom:0; height:1px;
       background:var(--txt); pointer-events:none;
       transition:transform .6s cubic-bezier(.4,0,.2,1), width .6s cubic-bezier(.4,0,.2,1), background-color var(--theme-duration) ease;}
  #topTabs > .tabg{transition:background-color var(--theme-duration) ease;}

  /* ---------- 视图与月份切换 ---------- */
  /* 页切换: 列表叠放交叉过渡; 容器高度瞬时调整, 不做高度动画(否则下方内容会慢慢滑=下沉感) */
  .pages{position:relative; overflow:hidden;}
  /* 内容区初始就占满视口: 加载期间底部署名不在首屏内, 避免刷新时的跳动/闪烁 */
  #viewStack{min-height:calc(100vh - 100px);}
  .page{position:absolute; top:0; left:0; width:100%; opacity:0; pointer-events:none;
        transform:translateX(0); margin-top:0;
        transition:opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);}
  .page.on{position:relative; opacity:1; pointer-events:auto; transform:translateX(0);}  /* 活动页留在文档流, 避免加载瞬间容器塌陷 */
  /* 进出场都用 keyframes: 显式定义起点, 不依赖元素残留状态 */
  @keyframes inR{from{opacity:0; transform:translateX(44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes inL{from{opacity:0; transform:translateX(-44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes outL{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(-44px);}}
  @keyframes outR{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(44px);}}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes fadeOut{from{opacity:1;} to{opacity:0;}}
  .page.anim-in-r{animation:inR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-in-l{animation:inL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-l{animation:outL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-r{animation:outR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-fade-in{animation:fadeIn .22s ease both; transition:none;}
  .page.anim-fade-out{animation:fadeOut .22s ease both; transition:none;}
  /* 静态隐藏态: 恢复视图时用, 绝不能带动画(否则刷新会补播一次淡出) */
  .page.off{opacity:0; pointer-events:none; transform:translateX(-44px); animation:none; transition:none;}
  /* 非活动视图整体不接收点击(含其内部元素) */
  #viewStack > .page:not(.on), #viewStack > .page:not(.on) *{pointer-events:none !important;}
  .sect{padding-top:8px;}
  .pfoot{color:var(--dim); font-size:11.5px; margin-top:40px; text-align:center; padding-bottom:8px; font-family:var(--sans);}
  .credit{color:var(--dim); font-size:11px; text-align:center; padding-bottom:16px; opacity:.8; font-family:var(--sans);}

  /* ---------- 列表通用：封面、标题行、日期状态、评分 ---------- */
  .list{display:flex; flex-direction:column;}
  .item{display:flex; align-items:stretch; position:relative; min-width:0;
       transition:background-color var(--theme-duration) ease, border-color var(--theme-duration) ease;}
  .pic{border-radius:8px; overflow:hidden; position:relative; background:var(--pic-bg);
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
  html.dark .pic{background:#0b0b0e;}   /* 夜间封面区比底色更暗 */
  .pic .cover{position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block;}
  .pic .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
       font-size:22px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .txt{min-width:0; flex:1; display:flex; flex-direction:column;}
  /* 评分数字的基线和标题第一行的基线对齐（游戏、电影、桌面、手机都一样） */
  .txt .tline{display:flex; align-items:baseline; min-width:0;}
  .txt .tline .t{font-weight:600; letter-spacing:-.01em; line-height:1.3;
       white-space:normal; overflow:hidden; text-overflow:ellipsis; min-width:0;
       display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .release-date{flex:none; color:var(--sub); font-weight:600; transition:color var(--theme-duration) ease;}
  .fine .sep,.mline .sep{color:var(--dim); opacity:.65; flex:none; margin:0 6px; font-weight:400;}
  /* 状态：已发售灰色；今天 / 明天发售用金色，「还有 N 天」用蓝灰色，两种状态一眼分开 */
  .when{flex:none; white-space:nowrap; font-weight:500; color:var(--dim);}
  .when.soon{color:var(--soon); font-weight:600;}
  .when.today{color:var(--today); font-weight:600;}
  /* 评分按位拆格：每位保持等宽格子，按齐线字体收紧间距；不用 flex/ch，避免字形撑开 */
  /* 上下负外边距让评分不参与标题行的高度计算：基线对齐时不会把标题往下推，也不会撑高标题行 */
  .gscore{position:static; flex:none; text-decoration:none; margin-block:-1em;
       display:inline-grid; grid-auto-flow:column; grid-auto-columns:var(--score-digit-width);
       justify-content:end; align-items:center;
       font-family:var(--score-serif); font-weight:700; letter-spacing:0; line-height:1;
       font-variant-numeric:normal; font-feature-settings:normal;
       transition:color var(--theme-duration) ease;}
  .gscore .dg{display:block; width:var(--score-digit-width); min-width:0; max-width:var(--score-digit-width);
       text-align:center; font-variant-numeric:normal; font-feature-settings:normal;}
  .gscore.g{color:var(--score-good);}
  .gscore.y{color:var(--score-mid);}
  .gscore.r{color:var(--score-low);}
  .gscore.g:is(:hover,:focus-visible){color:var(--score-good-hover);}
  .gscore.y:is(:hover,:focus-visible){color:var(--score-mid-hover);}
  .gscore.r:is(:hover,:focus-visible){color:var(--score-low-hover);}

  /* ---------- 游戏：单列横排，封面 460×215 ---------- */
  #body .item{align-items:center; gap:22px; padding:16px 0; border-bottom:1px solid var(--line);}
  #body .item .pic{flex:0 0 256px; width:256px; aspect-ratio:460 / 215;}
  #body .txt{justify-content:center; gap:var(--content-gap);}
  #body .txt .tline{justify-content:space-between; gap:16px;}
  #body .txt .tline .t{font-family:var(--work-title-font);
       font-size:20px; font-weight:700; letter-spacing:0; line-height:1.4;
       font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;}
  #body .gscore{font-size:32px;}
  #body .fine{display:flex; flex-wrap:wrap; align-items:baseline; color:var(--dim); font-size:13px; line-height:1.5;}
  #body .fine,#body .when,#body .chip{font-family:var(--sans); font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;}
  #body .when{font-size:13px; line-height:1.5;}
  .plats{display:flex; flex-wrap:wrap; gap:16px; margin-top:0;}
  /* 平台只显示图标加价格；悬停加下划线 */
  .chip{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
       font-size:13px; font-weight:500; line-height:14px; color:var(--txt); text-decoration:none;
       transition:color var(--theme-duration) ease;}
  .chip:hover{color:var(--txt); text-decoration:underline; text-underline-offset:4px;}
  .chip .pi{width:15px; height:15px; fill:currentColor; flex:none;}
  .chip .np{color:var(--dim); transition:color var(--theme-duration) ease;}   /* 平台暂无价格 */

  /* ---------- 海报网格（电影），海报 2:3 ---------- */
  /* 顶部留白和游戏第一行的上内边距一致（桌面 16px、手机 14px），两个视图的列表从同一高度开始 */
  .list.mgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px 20px; padding-top:16px;}
  .item.pc{flex-direction:column; overflow:hidden;}
  .item.pc .pic.m{width:100%; aspect-ratio:2/3; flex:none; box-shadow:none;}
  .item.pc .pic.m .ph{font-size:34px;}
  .item.pc .txt{padding:12px 0 0; gap:3px;}
  #movieBody .tline{gap:10px;}
  #movieBody .tline .t{flex:1; font-family:var(--work-title-font); font-size:26px; font-weight:700; line-height:1.25;}
  #movieBody .mline{display:flex; align-items:baseline; color:var(--dim);}
  #movieBody .mline,
  #movieBody .mstat{margin:0; font-family:var(--sans); font-size:13px; font-weight:500; line-height:1.5;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #movieBody .mstat{letter-spacing:.01em;}
  #movieBody .mstat.soon,#movieBody .mstat.today{font-weight:600;}
  #movieBody .gscore{text-shadow:none; font-size:36px;}

  /* ---------- 桌面 ---------- */
  @media (min-width:641px){
    /* 信息区与封面等高：标题和日期靠上，平台价格贴齐封面底部。 */
    #body .item{align-items:stretch;}
    #body .txt{justify-content:flex-start; gap:8px;}
    #body .txt .tline .t{font-size:26px; line-height:1.25;}
    #body .plats{margin-top:auto;}
  }

  /* ---------- 手机 ---------- */
  @media (max-width:640px){
    :root{--work-title-font:var(--sans);}
    .theme-btn::after{content:""; position:absolute; inset:-7px 0; border-radius:999px;}
    /* 月份数字、类别、月份页签放在同一行。
       手机用默认齐线的衬线数字，避免 Georgia 旧式 9 的高度差；固定两位数字宽度。 */
    .mh{gap:10px;}
    .mh .mn{font-size:52px; font-family:var(--score-serif); font-variant-numeric:normal;
         font-feature-settings:normal; flex:0 0 2ch; min-width:0;}
    .mh .gap{flex:1 1 0; min-width:4px;}
    /* 按钮宽度等于文字，下划线和文字对齐；点击范围靠伪元素扩到 44×44，相邻按钮之间留 16px 不重叠 */
    #tabs,#topTabs{gap:16px;}
    #tabs .tab::after,#topTabs .tab::after{content:""; position:absolute; inset:-11px -8px;}
    /* 游戏 */
    #body .item{gap:14px; padding:14px 0;}
    #body .item .pic{flex:0 0 clamp(108px,32vw,148px); width:clamp(108px,32vw,148px);}
    #body .item .txt{gap:4px;}
    #body .txt .tline .t{flex:1; font-size:16px; font-weight:600;}
    /* 紧凑行盒配合 44px 触摸范围，点击区不再撑开文字间距；平台换行不重叠。 */
    #body .gscore{font-size:24px; position:relative; z-index:3; min-width:44px; min-height:24px; height:24px;
         align-content:center; margin-left:calc(2 * var(--score-digit-width) - 44px);}
    #body .plats{gap:20px 12px;}   /* 平台之间 12px、图标和价格 4px，一眼分清哪个图标配哪个价格 */
    #body .chip{position:relative; z-index:3; min-width:44px; min-height:24px; height:24px; gap:4px;}
    #body .chip .pi{width:13px; height:13px;}
    #body .chip::after,#body .gscore::after{content:""; position:absolute; inset:-10px 0;}
    /* 电影 */
    .list.mgrid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 12px; padding-top:14px;}
    #movieBody .tline .t{font-size:16px; font-weight:600; line-height:1.4;}
    #movieBody .gscore{font-size:28px; position:relative; z-index:3; min-width:44px; min-height:28px; height:28px;
         margin-left:calc(2 * var(--score-digit-width) - 44px); align-content:start; top:3px;}   /* 大号衬线数字光学下移，和手机片名首行对齐 */
    #movieBody .gscore::after{content:""; position:absolute; inset:-8px 0;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="boot"><span class="spin"></span></div>
<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <h1>Release Calendar</h1>
      <button class="theme-btn" id="themeBtn" title="切换外观" aria-label="切换浅色/夜间模式">
        <span class="tb-knob"><svg class="tb-ic tb-ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="1.5" x2="12" y2="3.8"/><line x1="12" y1="20.2" x2="12" y2="22.5"/><line x1="4.6" y1="4.6" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.4" y2="19.4"/><line x1="1.5" y1="12" x2="3.8" y2="12"/><line x1="20.2" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="19.4" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.4" y2="4.6"/></svg><svg class="tb-ic tb-ic-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg></span>
      </button>
    </div>
    <!-- 月份和分类都在页头: 切视图时这条不参与淡入淡出 -->
    <div class="mh" id="mhBar">
      <span class="mn" id="mhMn"></span>
      <div class="tabs top" id="topTabs" role="group" aria-label="切换游戏和电影">
        <span class="tabg"></span>
        <button class="tab on" type="button" data-view="game" aria-pressed="true">游戏</button>
        <button class="tab" type="button" data-view="movie" aria-pressed="false">电影</button>
      </div>
      <span class="gap"></span>
      <div class="tabs" id="tabs" role="group" aria-label="切换月份"><span class="tabg"></span></div>
    </div>
  </header>
  <div class="pages" id="viewStack">
  <div class="page on" id="viewGame" aria-hidden="false">
    <div class="err" id="errBox"></div>
    <div id="body"><div class="loading"><span class="spin"></span></div></div>
  </div>
  <div class="page" id="viewMovie" inert aria-hidden="true">
    <div class="err" id="mErrBox"></div>
    <div id="movieBody"><div class="loading"><span class="spin"></span></div></div>
  </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

/* 夜间模式切换(iOS 开关样式, 状态由 CSS html.dark 驱动) */
(function(){
  const btn = document.getElementById('themeBtn');
  const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  /* 切到和系统一致的外观时清掉偏好，之后重新跟随系统；只有和系统相反时才记住 */
  if(btn) btn.addEventListener('click', ()=>{
    const dark = document.documentElement.classList.toggle('dark');
    try{
      if(mq && dark === mq.matches) localStorage.removeItem('glwTheme');
      else localStorage.setItem('glwTheme', dark ? 'dark' : 'light');
    }catch(e){}
  });
  /* 没有偏好时，系统外观变化立即跟随 */
  if(mq && mq.addEventListener) mq.addEventListener('change', e=>{
    let saved = null;
    try{ saved = localStorage.getItem('glwTheme'); }catch(err){}
    if(!saved) document.documentElement.classList.toggle('dark', e.matches);
  });
})();
const PALS = [['#0071e3','#0a58a5'],['#af52de','#6d2fa8'],['#ff375f','#b0183a'],
  ['#34c759','#1e7a3e'],['#ff9f0a','#b26a00'],['#5e5ce6','#3634a8'],
  ['#ff6482','#a81d3a'],['#30b0c7','#1a6a78']];
const today = new Date();
/* 平台官方矢量 logo(simple-icons, CC0): 内联避免外部请求, 颜色跟随标签文字 */
const PICONS = {
  steam: '<svg class="pi" viewBox="0 0 24 24"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/></svg>',
  ps: '<svg class="pi" viewBox="0 0 24 24"><path d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.04 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/></svg>',
  ns: '<svg class="pi" viewBox="0 0 24 24"><path d="M14.176 24h3.674c3.376 0 6.15-2.774 6.15-6.15V6.15C24 2.775 21.226 0 17.85 0H14.1c-.074 0-.15.074-.15.15v23.7c-.001.076.075.15.226.15zm4.574-13.199c1.351 0 2.399 1.125 2.399 2.398 0 1.352-1.125 2.4-2.399 2.4-1.35 0-2.4-1.049-2.4-2.4-.075-1.349 1.05-2.398 2.4-2.398zM11.4 0H6.15C2.775 0 0 2.775 0 6.15v11.7C0 21.226 2.775 24 6.15 24h5.25c.074 0 .15-.074.15-.149V.15c.001-.076-.075-.15-.15-.15zM9.676 22.051H6.15c-2.326 0-4.201-1.875-4.201-4.201V6.15c0-2.326 1.875-4.201 4.201-4.201H9.6l.076 20.102zM3.75 7.199c0 1.275.975 2.25 2.25 2.25s2.25-.975 2.25-2.25c0-1.273-.975-2.25-2.25-2.25s-2.25.977-2.25 2.25z"/></svg>'
};
function phColor(t){ let h=0; for(const c of t) h=(h*31+c.codePointAt(0))>>>0;
  const [a,b]=PALS[h%PALS.length]; return 'linear-gradient(135deg,'+a+','+b+')'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function refresh(){
  $('#errBox').style.display='none';
  try{
    const r = await fetch('releases.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
  }catch(e){
    $('#errBox').textContent='获取失败：'+e.message;
    $('#errBox').style.display='block';
    showCredit();
    hideBoot();
  }
}

function moveGlider(tabsEl, btn, instant){
  const g = tabsEl.querySelector('.tabg');
  if(!g || !btn) return;
  if(instant) g.style.transition = 'none';     // 首次/恢复定位: 不要滑动过程
  g.style.width = btn.offsetWidth + 'px';
  g.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  if(instant){ void g.offsetWidth; g.style.transition = ''; }
}

/* 通用: 月份页签 + 交叉重叠过渡; panels = [{body, groups, makeCard, unit, footFn}]
   一份页签可同时控制多个 panel(游戏/电影各自的列表), 切月时两边同步 */
function setPageActive(page, active){
  page.inert = !active;
  page.setAttribute('aria-hidden', String(!active));
}

function tabbed(tabsEl, panels){
  tabsEl.innerHTML = '<span class="tabg"></span>';  // 共享下划线层
  const tabKey = 'glwTab_' + (tabsEl.id || 'x');
  const groups = panels[0].groups;
  const monthKey = g => g.year + '-' + String(g.month).padStart(2, '0');
  const currentKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0');
  const currentIdx = Math.max(0, groups.findIndex(g=>monthKey(g)===currentKey));
  /* 所选月份只在本次浏览里记住（sessionStorage）；重新打开网站总是回到本月 */
  let savedMonth = '';
  try { savedMonth = sessionStorage.getItem(tabKey + '_month') || ''; } catch(e) {}
  const savedIdx = groups.findIndex(g=>monthKey(g)===savedMonth);
  let curIdx = savedIdx >= 0 ? savedIdx : currentIdx;
  const labelOf = g => {
    const relativeMonth = (g.year-today.getFullYear())*12 + g.month-(today.getMonth()+1);
    return ({'-1':'上月','0':'本月','1':'下月'})[relativeMonth] || (g.year+'年');
  };

  panels.forEach(p=>{
    p.body.innerHTML = '';
    const pagesEl = document.createElement('div'); pagesEl.className='pages';
    p.pagesEl = pagesEl; p.sections = [];
    p.groups.forEach((g,i)=>{
      const items = g.games || g.movies || g.albums || [];
      const sect = document.createElement('div');
      sect.className = 'sect page' + (i===curIdx ? ' on' : '');
      setPageActive(sect, i===curIdx);
      const list = document.createElement('div'); list.className='list' + (p.grid?' mgrid':'');
      if(!items.length) list.innerHTML='<div class="empty">'+esc(p.emptyText || '该月暂无已定档')+'</div>';
      else items.forEach(it=>list.appendChild(p.makeCard(it)));
      sect.appendChild(list);
      const ft = document.createElement('div'); ft.className = 'pfoot';
      ft.textContent = p.footFn ? p.footFn(g, items) : '';
      sect.appendChild(ft);
      const cr = document.createElement('div'); cr.className = 'credit'; cr.textContent = '@torge';
      sect.appendChild(cr);
      pagesEl.appendChild(sect); p.sections.push(sect);
    });
    p.body.appendChild(pagesEl);
    p.sections.forEach((section,i)=>{ if(i!==curIdx) section.classList.add('off'); });
    p.fit = ()=>{ if(p.holdH) return; if(p.sections[curIdx]) p.pagesEl.style.height = p.sections[curIdx].offsetHeight + 'px'; };
    p.fit();
  });

  const fitAll = ()=> panels.forEach(p=>p.fit());
  /* 两个类别共享所选月份，隐藏页在动画开始时就退出交互。 */
  const applyIdx = (p, i, animate)=>{
    const onIdx = p.sections.findIndex(s=>s.classList.contains('on'));
    const pCur = onIdx >= 0 ? onIdx : 0;
    if(pCur === i) return;
    const cur = p.sections[pCur], nxt = p.sections[i];
    if(!cur || !nxt) return;
    setPageActive(cur, false);
    setPageActive(nxt, true);
    if(animate){
      /* 动画期间容器按两页里更高的那页撑住: 否则高度立即缩到新页, 旧页多出的部分会被 .pages 的
         overflow:hidden 直接切掉(表现为"一部分内容没有动效就消失")。640ms 后再收敛到新页高度。 */
      const h = Math.max(cur.offsetHeight, nxt.offsetHeight);
      p.holdH = h; p.pagesEl.style.height = h + 'px';
      clearTimeout(p.holdT);
      p.holdT = setTimeout(()=>{ p.holdH = 0; p.fit(); stackFit(); }, 640);
      animSwap(cur, nxt, i > pCur);
    } else {
      PAGE_CLASSES.forEach(c=>{ cur.classList.remove(c); nxt.classList.remove(c); });
      cur.classList.add('off');
      nxt.classList.add('on');
    }
  };
  const switchTo = (i, animate)=>{
    if(i === curIdx) return;
    if(animate === undefined) animate = true;
    panels.forEach(p=>{
      applyIdx(p, i, animate);
    });
    curIdx = i;
    const mhMn = document.getElementById('mhMn');   /* 固定月份标题: 瞬时换字, 不参与交叉动画(避免大号衬线数字叠字) */
    if(mhMn) mhMn.textContent = String(groups[i].month).padStart(2,'0');
    try { sessionStorage.setItem(tabKey + '_month', monthKey(groups[i])); } catch(e) {}
    fitAll();
    stackFit();
    if(typeof wakeVisible === 'function') wakeVisible();   /* 新月份的图片此时才加载 */
    tabsEl.querySelectorAll('.tab').forEach((b,j)=>{
      b.classList.toggle('on', j===i);
      b.setAttribute('aria-pressed', String(j===i));
    });
    /* 下划线和月份列表一起切换。 */
    const actBtn = tabsEl.querySelectorAll('.tab')[i];
    moveGlider(tabsEl, actBtn, !animate);
  };

  /* 供手机左右滑动换月调用 */
  tabsEl._switchBy = d=>{ const j = curIdx + d; if(j>=0 && j<groups.length) switchTo(j); };

  panels[0].groups.forEach((g,i)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab' + (i===curIdx ? ' on' : '');
    btn.setAttribute('aria-pressed', String(i===curIdx));
    btn.textContent = labelOf(g);   /* 具体月份由下方大标题显示, 页签只标相对位置(不再重复) */
    btn.addEventListener('click', ()=>switchTo(i));
    tabsEl.appendChild(btn);
  });

  const fitKey = '_fit_' + (tabsEl.id || 'x');
  if(window[fitKey]) window.removeEventListener('resize', window[fitKey]);
  const resizeFit = ()=>{
    fitAll();
    moveGlider(tabsEl, tabsEl.querySelectorAll('.tab')[curIdx], true);
  };
  window[fitKey] = resizeFit;
  window.addEventListener('resize', resizeFit);
  moveGlider(tabsEl, tabsEl.querySelectorAll('.tab')[curIdx], true);   // 恢复定位不滑动
  const mhMn0 = document.getElementById('mhMn');
  if(mhMn0) mhMn0.textContent = String(groups[curIdx].month).padStart(2,'0');
  return fitAll;
}

/* 图片按需加载：卡片里的 <img> 只写 data-src，当前视图的当前月份显示时才换成 src。
   隐藏的月份和视图叠在首屏位置，浏览器的 loading="lazy" 会把它们当成可见，一打开就全部下载。 */
function wakeImages(root){
  if(!root) return;
  root.querySelectorAll('img[data-src]').forEach(img=>{
    img.setAttribute('src', img.dataset.src);
    img.removeAttribute('data-src');
  });
}
function visibleView(){
  const stack = document.getElementById('viewStack');
  return stack ? Array.from(stack.children).find(el=>el.classList.contains('on')) : null;
}
let warmT = null;
function wakeVisible(){
  const view = visibleView();
  if(!view) return;
  wakeImages(Array.from(view.querySelectorAll('.sect')).find(s=>s.classList.contains('on')));
  /* 稍后预载同一视图的其他月份，切月时图片已就位；另一个视图要切过去才加载 */
  clearTimeout(warmT);
  warmT = setTimeout(()=>{ const v = visibleView(); if(v) v.querySelectorAll('.sect').forEach(wakeImages); }, 1500);
}

function showCredit(){
  const c = document.querySelector('.credit');
  if(c) c.classList.add('show');
}

/* 数据就位后淡出启动遮罩 */
function hideBoot(){
  const b = document.getElementById('boot');
  if(!b) return;
  /* 先排版触发标题字体加载；Windows 桌面要等子集字体到位（最多 1.2 秒）再揭开，避免宋体闪一下再换 */
  void document.body.offsetHeight;
  const ready = (document.fonts && document.fonts.ready) || Promise.resolve();
  Promise.race([ready, new Promise(r=>setTimeout(r, 1200))]).then(()=>setTimeout(()=>b.classList.add('hide'), 60));
}
/* 字体换上后标题高度可能变化，重算列表容器高度，防止被 overflow:hidden 裁掉 */
if(document.fonts) document.fonts.addEventListener('loadingdone', ()=>{
  if(window['_fit_tabs']) window['_fit_tabs']();
  stackFit();
});

let holdStackH = 0, stackHT = null;   // 视图切换动画期间锁住容器高度(避免旧视图被提前裁掉)
function stackFit(){
  if(holdStackH) return;
  const stack = document.getElementById('viewStack');
  if(!stack) return;
  /* 只认直接子视图, 不能用 querySelector('.page.on')——会误命中嵌套的子页签页(viewGame/viewMovie 内部) */
  const on = Array.from(stack.children).find(el=>el.classList.contains('on'));
  if(!on) return;
  stack.style.height = on.offsetHeight + 'px';   // 瞬时, 不做高度动画
}

const PAGE_CLASSES = ['on','off','anim-in-r','anim-in-l','anim-out-l','anim-out-r','anim-fade-in','anim-fade-out'];

/* 交叉重叠过渡: 旧页出场 + 新页进场(都用 keyframes, 每次强制重播) */
function animSwap(cur, nxt, forward){
  cur.classList.remove(...PAGE_CLASSES);
  void cur.offsetWidth;                                  // 强制回流, 保证动画重播
  cur.classList.add(forward ? 'anim-out-l' : 'anim-out-r');
  nxt.classList.remove(...PAGE_CLASSES);
  void nxt.offsetWidth;
  nxt.classList.add(forward ? 'anim-in-r' : 'anim-in-l');
  nxt.classList.add('on');
}
function animFade(cur, nxt){
  cur.classList.remove(...PAGE_CLASSES);
  void cur.offsetWidth;
  cur.classList.add('anim-fade-out');
  nxt.classList.remove(...PAGE_CLASSES);
  void nxt.offsetWidth;
  nxt.classList.add('anim-fade-in', 'on');
}

let state = { game: null, movie: null };
/* 两份数据任一到位就重建(月签只有一份, 同时控制两边列表) */
function paint(){
  const panels = [];
  if(state.game) panels.push({
    body: $('#body'), groups: state.game.groups || [], makeCard: card, unit: '款',
    footFn: g => '共 ' + g.games.length + ' 款 · 评分来自 Metacritic · 每月初更新'
  });
  if(state.movie) panels.push({
    body: $('#movieBody'), groups: state.movie.groups || [], makeCard: mcard, unit: '部', grid: true,
    footFn: g => '共 ' + g.movies.length + ' 部 · 评分来自豆瓣 · 每月初更新'
  });
  if(!panels.length) return;
  tabbed($('#tabs'), panels);
  showCredit();
  stackFit();
  wakeVisible();
  hideBoot();
}

function render(d){
  state.game = d;
  paint();
}

/* 评分按位拆开，每位一格。手机上的衬线数字不等宽，整段右对齐只能对齐个位 */
function scoreLink(n, cls, href, label){
  const digits = String(n).replace(/\d/g, d => '<span class="dg">'+d+'</span>');
  return '<a class="gscore '+cls+'" href="'+esc(href)+'" target="_blank" rel="noopener" aria-label="'+esc(label)+'">'+digits+'</a>';
}

function card(it){
  const wrap = document.createElement('div'); wrap.className='item';
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt, whenCls;
  if(diff===0){ whenTxt='今天发售'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天发售'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有'+diff+'天'; whenCls='soon'; }   /* 和电影一致，不加空格 */
  else { whenTxt='已发售'; whenCls='out'; }
  const whenTag = '<span class="when '+whenCls+'">'+whenTxt+'</span>';
  const pl = it.plats||[];
  /* 封面框为 460×215。选图优先 Steam header.jpg；候选链 cover_img、Steam、NS、PS，加载失败再换下一张 */
  const cand = [];
  if(it.cover_img) cand.push(it.cover_img);
  ['steam','ns','ps'].forEach(k=>{ const p=pl.find(x=>x.key===k); if(p&&p.img) cand.push(p.img); });
  const imgUrl = cand[0] || '';
  const candJson = JSON.stringify(cand).replace(/'/g, "&#39;");
  const imgTag = imgUrl
    ? '<img class="cover" data-src="'+esc(imgUrl)+'" alt="" loading="lazy" data-cand="'+candJson+'" onerror="cf(this)" onload="ckw(this)">'
    : '';
  const chips = pl.map(p=>{
    const pv = p.price;
    let pfmt = '';
    if (pv!=null && pv!==false && pv!=='') {
      const n = Number(pv);
      pfmt = (n % 1 === 0) ? String(n) : n.toFixed(2);
      pfmt = (p.key==='steam' ? '¥'+pfmt : 'HK$'+pfmt);
    }
    const url = p.url ? 'href="'+esc(p.url)+'" target="_blank" rel="noopener"' : '';
    const pm = (p.key==='steam'?'st':p.key);
    return '<a class="chip '+pm+'" '+url+' aria-label="'+esc(p.name+' '+(pfmt||'暂无价格'))+'">'+(PICONS[p.key]||'')+
      (pfmt?pfmt:'<span class="np">暂无价格</span>')+'</a>';
  }).join('');
  const mc = (typeof it.mc==='number' && it.mc>0) ? it.mc : null;
  const scoreCls = mc==null ? '' : (mc>=80?'g':(mc>=60?'y':'r'));
  const score = mc ? scoreLink(mc, scoreCls, it.mc_url||'https://www.metacritic.com/', 'Metacritic '+mc) : '';
  const fine = '<span class="release-date">'+it.month+'月'+it.day+'日</span><span class="sep">·</span>'+whenTag;
  wrap.innerHTML =
    '<div class="pic">'+imgTag+
      '<div class="ph" style="background:'+phColor(it.title)+(imgUrl?';display:none':'')+'">'+esc(firstChar(gameTitle(it.title)))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div>'+score+'</div>'+
      '<div class="fine">'+fine+'</div>'+
      (chips?'<div class="plats">'+chips+'</div>':'')+
    '</div>';
  wrap.querySelector('.t').textContent = gameTitle(it.title);   /* 游戏名纯文本: 商店跳转靠下面的平台标签 */
  return wrap;
}

/* 有中文名时只留中文；去掉括号里的年份、重制版等和名字无关的说明，以及 ™ ® © 符号 */
function gameTitle(raw){
  let t = String(raw==null?'':raw).replace(/[™®©]/g, '').replace(/\s*[（(][^）)]*[）)]/g, ' ').replace(/\s+/g, ' ').trim();
  if(/[\u4e00-\u9fff]/.test(t)){
    t = t.replace(/(^|[\s:：/／|])[A-Za-z][A-Za-z0-9'’&.:+-]*(?:\s+[A-Za-z0-9][A-Za-z0-9'’&.:+-]*)*/g, '$1');
    t = t.replace(/\s+/g, ' ').trim();
  }
  return t;
}

function firstChar(t){ t=(t||'').trim(); return t?Array.from(t)[0]:'?'; }

/* 封面多级兜底: 当前图加载失败 -> 依次试候选链中下一张 -> 全失败显示首字占位 */
function cf(img){
  const cand = JSON.parse(img.dataset.cand || '[]');
  const idx = cand.indexOf(img.getAttribute('src'));   /* 用原始写法比对；img.src 是补全后的绝对地址 */
  const next = cand[idx + 1];
  if(next){ img.src = next; return; }
  img.style.display='none';
  const ph = img.parentNode && img.parentNode.querySelector('.ph');
  if(ph) ph.style.display='flex';
}

/* 超宽图(比例>2.35)切 contain 完整显示, 避免横幅被裁 */
function ckw(img){
  try{
    if(img.naturalWidth && img.naturalHeight && img.naturalWidth/img.naturalHeight > 2.35){
      img.classList.add('wide');
    }
  }catch(e){}
}

/* ---------- 电影(豆瓣) ---------- */
function mcard(it){
  const wrap = document.createElement('div'); wrap.className='item mv pc';
  const sc = (typeof it.score==='number' && it.score>0) ? it.score : null;
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt='', whenCls='';
  if(diff===0){ whenTxt='今天上映'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天上映'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有'+diff+'天'; whenCls='soon'; }
  else { whenTxt='已上映'; whenCls='out'; }
  const img = it.poster
    ? '<img class="cover" data-src="'+esc(it.poster)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  /* 豆瓣 10 分制 ×10，颜色规则与游戏相同：≥80 绿 / ≥60 黄 / <60 红 */
  const shown = sc!=null ? Math.round(sc*10) : null;
  const scoreCls = shown==null ? '' : (shown>=80?'g':(shown>=60?'y':'r'));
  const mc = shown!=null ? scoreLink(shown, scoreCls, it.url||'https://movie.douban.com/', '豆瓣 '+shown) : '';
  const meta = '<span class="release-date">'+it.month+'月'+it.day+'日</span>'+
    '<span class="sep">·</span>'+
    '<span class="mstat when '+whenCls+'">'+esc(whenTxt)+'</span>';
  wrap.innerHTML =
    '<div class="pic m">'+img+
      '<div class="ph" style="background:'+phColor(it.title)+(it.poster?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div>'+mc+'</div>'+
      '<div class="mline">'+meta+'</div>'+
    '</div>';
  wrap.querySelector('.t').textContent = it.title;   /* 电影名纯文本: 跳转只走评分块 */
  return wrap;
}

function renderMovies(d){
  state.movie = d;
  paint();
}

let moviesLoaded = false;
async function refreshMovies(){
  if(moviesLoaded) return;
  const box = $('#mErrBox');
  box.style.display='none';
  try{
    const r = await fetch('movies.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    renderMovies(d);
    moviesLoaded = true;
  }catch(e){
    box.textContent='获取失败：'+e.message;
    box.style.display='block';
  }
}

/* 顶层切换: 游戏 / 电影（淡入淡出，记住上次视图） */
(function(){
  const top = document.getElementById('topTabs');
  if(!top) return;
  const btns = Array.from(top.querySelectorAll('.tab'));
  const g = document.getElementById('viewGame'), m = document.getElementById('viewMovie');
  let curView = 'game';

  const VIEWS = ['game', 'movie'];
  const viewEl = { game: g, movie: m };
  function setView(v, animate){
    if(v === curView || VIEWS.indexOf(v) < 0) return;
    const cur = viewEl[curView], nxt = viewEl[v];
    setPageActive(cur, false);
    setPageActive(nxt, true);
    if(animate){
      const stackEl = document.getElementById('viewStack');
      const hh = Math.max(cur.offsetHeight, nxt.offsetHeight);
      holdStackH = hh;
      if(stackEl) stackEl.style.height = hh + 'px';
      clearTimeout(stackHT);
      stackHT = setTimeout(()=>{ holdStackH = 0; stackFit(); }, 260);
      animFade(cur, nxt);          // 类别切换只淡入淡出; 月份切换仍走 animSwap 的横向过渡
    } else {
      PAGE_CLASSES.forEach(c=>{ cur.classList.remove(c); nxt.classList.remove(c); });
      nxt.classList.add('on');
      cur.classList.add('off');          // 静态隐藏(无动画), 刷新恢复时不会补播淡出
    }
    curView = v;
    btns.forEach(b=>{
      const selected = b.dataset.view === v;
      b.classList.toggle('on', selected);
      b.setAttribute('aria-pressed', String(selected));
    });
    const curBtn = btns.find(b=>b.dataset.view === v);
    if(curBtn) moveGlider(top, curBtn, true);   // 类别只淡入淡出，下划线直接定位，不横向滑动
    if(v === 'movie') refreshMovies();
    /* 直接用新视图高度(切换瞬间它可能还没拿到 on), 高度瞬时调整 */
    const stack = document.getElementById('viewStack');
    if(stack) stack.style.height = nxt.offsetHeight + 'px';
    if(window['_fit_tabs']) window['_fit_tabs']();
    wakeVisible();
    try { localStorage.setItem('glwView', v); } catch(e) {}
  }

  btns.forEach(btn=>btn.addEventListener('click', ()=>setView(btn.dataset.view, true)));

  let saved = 'game';
  try { saved = localStorage.getItem('glwView') || 'game'; } catch(e) {}
  if(saved === 'movie') setView(saved, false);   // 恢复上次视图(无动画)
  moveGlider(top, top.querySelector('.tab.on') || btns[0], true);   // 恢复定位不滑动
  const alignViewGlider = ()=>moveGlider(top, top.querySelector('.tab.on') || btns[0], true);
  window.addEventListener('resize', alignViewGlider);
  window.addEventListener('load', alignViewGlider);
  window.addEventListener('resize', stackFit);
  stackFit();
})();

/* 手机左右滑动换月：左滑看下一个月，右滑看上一个月。避开屏幕边缘，留给系统的返回手势 */
(function(){
  const stack = document.getElementById('viewStack');
  if(!stack) return;
  let sx = 0, sy = 0, st = 0, track = false;
  stack.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1){ track = false; return; }
    const t = e.touches[0];
    track = t.clientX > 24 && t.clientX < window.innerWidth - 24;
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, {passive:true});
  stack.addEventListener('touchend', e=>{
    if(!track) return;
    track = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Date.now() - st > 700 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
    const tabs = document.getElementById('tabs');
    if(tabs && tabs._switchBy) tabs._switchBy(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

window.addEventListener('load', stackFit);   // 字体/图片就位后重算高度
refresh();
refreshMovies();   // 预渲染电影视图: 首次切换时高度已就位, 避免"先塌后撑"的下沉
</script>
