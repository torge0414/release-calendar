<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Calendar</title>
<script>/* 主题预载(防闪烁): 存过偏好用偏好, 否则跟随系统 */
try{var _t=localStorage.getItem('glwTheme');
if((_t==='dark')||(!_t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
}catch(e){}</script>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --txt:#1d1d1f; --sub:#6e6e73; --dim:#707072; --tab:#656567;
    --line:rgba(0,0,0,.05);
    --acc:#0071e3; --acc-bg:#e8f1fd;
    --today:#ff9f0a;
    --st:#0071e3; --st-bg:#e8f1fd;
    --ps:#5e5ce6; --ps-bg:#ecebfb;
    --ns:#ff375f; --ns-bg:#feeaef;
    --pic-bg:#e9e9ee; --spin:#d2d2d7; --switch-bg:#e3e3e8;
    --shadow:0 2px 6px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.07);
    --shadow-hi:0 4px 10px rgba(0,0,0,.06), 0 18px 44px rgba(0,0,0,.11);
    --r:18px;
  }
  html.dark{
    --bg:#101013; --card:#1c1c21; --txt:#f5f5f7; --sub:#9b9ba1; --dim:#7c7c7e; --tab:#a4a4a6;
    --line:rgba(255,255,255,.09);
    --acc:#3fa2ff; --acc-bg:#0d2b4a;
    --st:#54aaff; --st-bg:#0d2b4a;
    --ps:#a5a1ff; --ps-bg:#2a2852;
    --ns:#ff6b86; --ns-bg:#4a1d2c;
    --pic-bg:#232329; --spin:#4a4a52; --switch-bg:#3a3a3e;
    --shadow:0 2px 6px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.32);
    --shadow-hi:0 5px 12px rgba(0,0,0,.55), 0 22px 52px rgba(0,0,0,.45);
  }
  html.dark .err{background:#361d1a; border-color:#6b322c; color:#ffb4a6;}
  /* 封面画框在夜间保持浅色, 超宽横幅(完整显示)的留白处能把深色封面衬出来 */
  html.dark .pic{background:#c9c9cf;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); min-width:320px;
    font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased; padding:26px 20px 44px; overflow-x:hidden;
    font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;
  }
  .wrap{max-width:860px; margin:0 auto; position:relative;}
  /* 主题切换的变色节奏与全站统一 0.6s(否则有的元素瞬间跳、有的渐变, 看起来"慢半拍") */
  :where(body,.t,.tag,.sub,.meta,.ft,.credit,h1,.pic,.tabs,.tab,.err,.when){transition:background-color .6s, color .6s, border-color .6s;}
  .mast{position:relative;}
  .theme-btn{
    position:absolute; right:0; top:0; margin:0;
    display:block; width:54px; height:31px; border-radius:999px;
    border:0; cursor:pointer; background:var(--switch-bg); padding:0;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1px 2px rgba(0,0,0,.06);
    transition:background .6s, transform .6s cubic-bezier(.4,0,.2,1), box-shadow .6s; z-index:5;
  }
  .theme-btn:hover{transform:scale(1.06); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),
       inset 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.14);}
  .theme-btn:active{transform:scale(.96);}
  .theme-btn .tb-sun,.theme-btn .tb-moon{position:absolute; top:50%; transform:translateY(-50%);
       font-size:12px; line-height:1; color:var(--dim); pointer-events:none; transition:color .6s;}
  .theme-btn .tb-sun{left:9px;}
  .theme-btn .tb-moon{right:8px;}
  html.dark .theme-btn .tb-sun{color:#d8a13a;}
  html.dark .theme-btn .tb-moon{color:#9aa0a6;}
  .theme-btn .tb-knob{
    position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    transition:left .6s cubic-bezier(.4,0,.2,1), background-color .6s;
  }
  /* 夜间主题旋钮用深色, 与浅色主题的白旋钮区分开(否则两个主题下都是白圆点) */
  html.dark .theme-btn .tb-knob{left:25px; background:#565661;
       box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.08);}
  header{text-align:center; padding:10px 0 4px;}
  .eyebrow{font-size:12px; font-weight:600; color:var(--acc); letter-spacing:.24em;
       text-transform:uppercase; margin-bottom:12px; padding:0 64px;}
  h1{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
     font-size:clamp(23px,6.8vw,40px); font-weight:700; letter-spacing:.1em; line-height:1.1;
     white-space:nowrap; padding:0 64px;}
  .sub{font-size:15px; color:var(--sub); margin-top:10px;}
  .meta{font-size:11.5px; color:var(--dim); margin-top:0; padding-top:10px; display:flex; align-items:center;
       justify-content:center; gap:7px;}
  .meta .msep{opacity:.5;}
  .sect{margin-top:16px;}
  /* 页切换: 两列表叠放交叉过渡(重叠淡入淡出); 容器高度瞬时调整, 不做高度动画(否则下方内容会慢慢滑=下沉感) */
  .pages{position:relative;}
  .page{position:absolute; top:0; left:0; width:100%; opacity:0; pointer-events:none;
        transform:translateX(0); margin-top:0;
        transition:opacity .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1);}
  .page.on{position:relative; opacity:1; pointer-events:auto; transform:translateX(0);}  /* 活动页留在文档流, 避免加载瞬间容器塌陷(底部元素上跳) */
  .page.pre-r{opacity:0; transform:translateX(44px);}
  .page.pre-l{opacity:0; transform:translateX(-44px);}
  /* 进出场都用 keyframes: 显式定义起点, 不依赖元素残留状态(transition 会被起点问题吞掉) */
  @keyframes inR{from{opacity:0; transform:translateX(44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes inL{from{opacity:0; transform:translateX(-44px);} to{opacity:1; transform:translateX(0);}}
  @keyframes outL{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(-44px);}}
  @keyframes outR{from{opacity:1; transform:translateX(0);} to{opacity:0; transform:translateX(44px);}}
  .page.anim-in-r{animation:inR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-in-l{animation:inL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-l{animation:outL .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  .page.anim-out-r{animation:outR .6s cubic-bezier(.4,0,.2,1) both; transition:none;}
  /* 静态隐藏态: 恢复视图时用, 绝不能带动画(否则刷新会补播一次淡出) */
  .page.off{opacity:0; pointer-events:none; transform:translateX(-44px); animation:none; transition:none;}
  /* 非活动视图整体不接收点击(含其内部元素): 否则卡片自身 pointer-events:auto 会盖住当前视图的胶囊/评分块 */
  #viewStack > .page:not(.on), #viewStack > .page:not(.on) *{pointer-events:none !important;}
  /* 非活动视图(静止态 .off)高度归零并裁剪: absolute 元素即使不占布局, 也会把超出部分算进文档滚动高度,
     导致「当前列表很短但滚动条很长」(最长的那份列表在撑高页面)。只在静止态生效, 动画中的 anim-* 类不受影响。 */
  /* 列表很短但滚动条很长: absolute 的页面即使不占布局, 超出部分仍算进文档滚动高度。
     .pages(顶层 #viewStack 和视图内的月份容器)的高度已由 JS 设为"当前显示页"的高度,
     再加 overflow:hidden 裁掉其余页的溢出, 文档高度就只随当前列表变化。 */
  .pages{overflow:hidden;}
  /* 内容区初始就占满视口: 加载期间底部署名不在首屏内, 避免刷新时的跳动/闪烁 */
  #viewStack{min-height:calc(100vh - 100px);}
  .h2c{font-size:12.5px; color:var(--dim); font-weight:500; text-align:center; margin:0 0 12px; padding-top:16px;}
  .sect{padding-top:16px;}   /* 顶部间距(原来挂在列表上方的计数行上) */
  .sect h2{
    font-size:17px; font-weight:700; color:var(--txt); letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:10px; margin:0 6px 14px;
  }
  .sect h2 .n{color:var(--acc); font-size:24px;}
  .sect h2 .count{font-size:12.5px; font-weight:500; color:var(--dim); margin-left:auto;}
  /* 单列横卡: 封面左 信息右(封面用原始比例, 清晰度最佳) */
  .list{display:flex; flex-direction:column; gap:10px;}
  .item{
    display:flex; align-items:stretch; gap:20px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r); padding:18px 22px 18px 18px;
    box-shadow:var(--shadow); transition:transform .6s cubic-bezier(.4,0,.2,1), box-shadow .6s, background-color .6s, color .6s, border-color .6s;
    position:relative; min-width:0;
  }
  .item:hover{box-shadow:var(--shadow-hi);}   /* 悬停不做上下位移 */
  .item.today{border-color:rgba(255,159,10,.45);}
  .item.today::before{
    content:""; position:absolute; left:-1px; top:18px; bottom:18px; width:3px;
    border-radius:0 3px 3px 0; background:var(--today);
  }
  .pic{flex:0 0 216px; width:216px; height:108px; border-radius:14px; overflow:hidden;
       position:relative; background:var(--pic-bg); flex:none;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
  .pic .cover{position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block;
       transition:width .6s cubic-bezier(.4,0,.2,1), height .6s cubic-bezier(.4,0,.2,1),
                  left .6s cubic-bezier(.4,0,.2,1), top .6s cubic-bezier(.4,0,.2,1);}
  .pic .cover.wide{object-fit:contain;}  /* 超宽横幅完整显示(不裁切) */
  .pic .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
       font-size:22px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .txt{min-width:0; flex:1; padding:0; display:flex; flex-direction:column;}
  .txt .tline{display:flex; align-items:center; gap:8px; min-width:0;}
  .txt .tline a.t{color:inherit; text-decoration:none; transition:opacity .6s;}
  .txt .tline a.t:hover{opacity:.7;}
  .txt .tline .t{font-size:17px; font-weight:600; letter-spacing:-.01em; line-height:1.3;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .txt .when{position:absolute; right:18px; top:14px; flex:none; font-size:10.5px; font-weight:700; border-radius:7px; padding:2px 8px;
       line-height:1.4; letter-spacing:.01em; white-space:nowrap; z-index:2;}
  .txt .tline.haswhen .t{padding-right:64px;}   /* 有徽章时给右上角让位 */
  .when.soon{background:var(--acc-bg); color:var(--acc);}
  .when.today{background:#fff0dd; color:#b26a00;}
  html.dark .when.today{background:#4a320f; color:#ffc46b;}
  .when.out{background:rgba(52,199,89,.14); color:#1f9d55;}
  html.dark .when.out{background:rgba(48,209,88,.18); color:#4cd964;}
  .txt .tag{font-size:12.5px; color:var(--dim); margin-top:5px; display:flex; align-items:center; gap:7px;
       flex-wrap:wrap;}
  .txt .tag b{color:var(--today); font-weight:700;}
  .txt .tag .mc{display:none;}
  .txt .tag.tag3{margin-top:2px; padding-right:56px;}   /* 给右下角评分块让位 */
  .mcbox{position:absolute; right:18px; bottom:14px; border-radius:11px; padding:0;
       width:42px; height:42px; box-sizing:border-box; color:#fff; display:flex; align-items:center; justify-content:center;
       line-height:1; z-index:2; box-shadow:0 2px 8px rgba(0,0,0,.18); text-decoration:none;
       transition:box-shadow .6s;}   /* 悬停压暗要有过渡(全站统一 0.6s) */
  /* 悬停: 背景压暗(与平台标签同一套效果)。数字本身已是白色, 压暗底色后对比度更高、白字更跳。
     保留原有的投影, 只叠一层 inset 黑。暗色主题有更高特异性的投影规则, 需单独补一条。 */
  .mcbox:hover{box-shadow:0 2px 8px rgba(0,0,0,.18), inset 0 0 0 99px rgba(0,0,0,.26);}
  html.dark .mcbox:hover{box-shadow:0 2px 10px rgba(0,0,0,.45), inset 0 0 0 99px rgba(0,0,0,.26);}
  .mcbox .mcv{font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1; text-decoration:none;}
  .mcbox.g,.mcbox.y,.mcbox.r{text-align:center;}
  .mcbox.g{background:#2a9257;} .mcbox.y{background:#d49d48;} .mcbox.r{background:#c8524d;}
  html.dark .mcbox{box-shadow:0 2px 10px rgba(0,0,0,.45);}
  .plats{display:flex; gap:7px; margin-top:auto; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; font-weight:600; text-decoration:none; border-radius:980px;
    padding:3px 11px; display:inline-flex; align-items:center; gap:5px;
    transition:transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s, color .6s, background-color .6s;
    letter-spacing:.01em; white-space:nowrap;
    height:20px; box-sizing:border-box;   /* 固定高度: 悬停放大字号时不撑开卡片、不推挤列表 */
    line-height:14px;                     /* 固定行盒: 否则字号变大时文字在胶囊内上下跳 */
  }
  /* 悬停放大用字号/内边距(而非 transform:scale): scale 会按位图栅格化文字,动画期间发糊 */
  /* 悬停反馈只改色彩、不动几何: 放大必然让字形变高(糊/位移); filter/transform 会提升合成层重栅格化文字。
     内阴影铺一层半透明黑 = 底色加深, 纯绘制、文字保持矢量清晰、布局零变化。 */
  .chip .pd{font-weight:500; opacity:.65; font-size:10.5px;}
  /* 按 torge 要求: Steam 与 PS 的配色对调(Steam 用原 PS 的紫蓝, PS 用原 Steam 的亮蓝) */
  .chip.st{color:var(--ps); background:var(--ps-bg);}
  .chip.ps{color:var(--st); background:var(--st-bg);}
  .chip.ns{color:var(--ns); background:var(--ns-bg);}
  /* 悬停: 背景压暗 + 字体变亮(白)。必须放在平台色规则之后, 否则 .chip.st 的 color 会盖住这里的白。
     外描边不参与布局 → 无位移; 字号不变 → 文字不糊。 */
  .chip:hover{color:rgba(255,255,255,.92); transform:translateY(-2px);
       box-shadow:0 4px 10px rgba(0,0,0,.18), 0 0 0 2px rgba(0,0,0,.08), inset 0 0 0 99px rgba(0,0,0,.20);}
  .empty{color:var(--dim); font-size:14px; padding:18px 8px; text-align:center;}
  .loading{color:var(--dim); font-size:14px; text-align:center; padding:52px 0;}
  .loading .spin{display:inline-block; width:22px; height:22px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* 启动遮罩: 数据就位前盖住整页, 所有布局变化都发生在遮罩下(刷新时看不到元素移动) */
  #boot{position:fixed; inset:0; background:var(--bg); z-index:99; display:flex;
       align-items:center; justify-content:center; transition:opacity .35s ease;}
  #boot.hide{opacity:0; pointer-events:none;}
  #boot .spin{display:inline-block; width:26px; height:26px; border:2.5px solid var(--spin);
       border-top-color:var(--acc); border-radius:50%; animation:sp .6s linear infinite;}
  .err{background:#fff2f0; border:1px solid #ffd7d2; color:#c0422a; padding:11px 16px;
       border-radius:12px; font-size:13px; margin-top:14px; display:none; text-align:center;}
  .tabs{display:flex; width:max-content; max-width:100%; margin:20px auto 2px; background:var(--switch-bg);
       border-radius:999px; padding:3px; gap:2px; position:relative;
       overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
       box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1px 2px rgba(0,0,0,.05);}
  .tabs::-webkit-scrollbar{display:none;}
  .tabg{position:absolute; top:3px; left:3px; bottom:3px; background:#fff; border-radius:999px;
       box-shadow:0 1px 4px rgba(0,0,0,.14); z-index:0;
       transition:transform .6s cubic-bezier(.4,0,.2,1), width .6s cubic-bezier(.4,0,.2,1), background-color .6s;}
  html.dark .tabg{background:#2c2c31;}
  .tab{
    position:relative; z-index:1; border:0; background:transparent; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:600; color:var(--tab); padding:7px 22px; flex:none; white-space:nowrap;
    border-radius:999px; transition:color .6s;
  }
  .tab:hover{color:var(--txt);}
  .tab.on{color:var(--txt);}
  .tabs.top{margin:30px auto 2px;}   /* 标题与下方内容拉开距离 */
  .pic.m{flex:0 0 68px; width:68px; height:100px;}
  .pic.sq{flex:0 0 68px; width:68px; height:68px;}   /* 专辑封面: 正方形 */
  .pic.m .ph{font-size:20px;}
  footer{color:var(--dim); font-size:11.5px; margin-top:40px; text-align:center; padding-bottom:8px;}
  .pfoot{color:var(--dim); font-size:11.5px; margin-top:40px; text-align:center; padding-bottom:8px;}
  .credit{color:var(--dim); font-size:11px; text-align:center; padding-bottom:16px; opacity:.8;}
  @media (max-width:640px){
    /* 窄屏: 平台标签让出右下角评分块区域, 放不下自动换行(宽屏不受影响) */
    .plats{padding-right:62px;}
  }
  /* 月份大标题(编辑排版: 大号衬线月份 + 年份 + 通栏细线) */
  .mh{display:flex; align-items:center; gap:12px; margin:8px 6px 18px;
      font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;}
  .mh .mn{font-size:46px; font-weight:700; letter-spacing:-.02em; line-height:1;}
  .mh .my{font-size:15px; color:var(--dim);}
  .mh .msep2{flex:1; height:1px; background:var(--line);}
  /* 电影: 海报墙网格(Letterboxd 式竖版海报卡) */
  .list.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px;}
  .item.pc{flex-direction:column; align-items:stretch; padding:0; gap:0; overflow:hidden;}
  .item.pc .pic.m{width:100%; height:auto; aspect-ratio:2/3; flex:none; border-radius:0;
       box-shadow:none;}
  .item.pc .pic.m .ph{font-size:34px;}
  .item.pc .txt{padding:12px 14px 14px;}
  .item.pc .txt .tline .t{white-space:normal; display:-webkit-box; -webkit-line-clamp:2;
       -webkit-box-orient:vertical; font-size:14.5px;}
  .item.pc .when{left:8px; right:auto; top:8px;}
  .item.pc .tline.haswhen .t{padding-right:0;}
  .item.pc .mcbox{top:8px; right:8px; bottom:auto; width:34px; height:34px; border-radius:9px;}
  .item.pc .mcbox .mcv{font-size:14px;}
  .item.pc .tag3{padding-right:0;}
  .item.pc.today::before{top:14px; bottom:auto; height:44px;}
  /* 月份标题固定在页签下方(移出动画区, 瞬时换字, 不再叠字) */
  #mhBar{margin:16px 6px 18px;}
  /* 更新时间收在横线右端, 小字弱化(原来是独立一行, 突兀) */
  .mh .mup{font-size:11px; color:var(--dim); white-space:nowrap;}
  /* 平台标签内联官方 logo */
  .chip .pi{width:13px; height:13px; fill:currentColor; flex:none;}
  /* 封面悬停放大: 拉大图片盒并居中, 由画框裁切。不用 transform:scale,
     scale 会把已栅格化的位图再拉伸, 过程中变糊、停住后又变清晰。 */
  .item:hover .pic .cover{width:106%; height:106%; left:-3%; top:-3%;}
  /* 主题滑块: 旋钮内嵌太阳/月亮矢量图标, 旋转交叉过渡 */
  .tb-ic{position:absolute; width:15px; height:15px; fill:none; stroke:currentColor;
       stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
       transition:transform .6s cubic-bezier(.4,0,.2,1), opacity .6s;}
  .tb-ic-sun{color:#d18a1d;}
  /* 月亮只在夜间主题可见(深色旋钮上), 用浅蓝灰保证对比度 */
  .tb-ic-moon{color:#d6ddf2; opacity:0; transform:rotate(-90deg) scale(.4);}
  html.dark .tb-ic-sun{opacity:0; transform:rotate(90deg) scale(.4);}
  html.dark .tb-ic-moon{opacity:1; transform:rotate(0) scale(1);}
  @media (max-width:640px){
    /* 主标题随屏宽缩放(覆盖旧的固定 32px: 衬线+宽字距在窄屏会溢出) */
    h1{font-size:clamp(15px,4.8vw,32px); letter-spacing:.04em; white-space:nowrap; padding:0 60px;}
    .eyebrow{letter-spacing:.18em;}
    .pic{flex-basis:150px; width:150px; height:75px;}
    .list.mgrid{grid-template-columns:repeat(auto-fill,minmax(106px,1fr)); gap:10px;}
    .mh .mn{font-size:34px;}
    /* 窄屏游戏卡专用网格: 封面居左跨标题+日期两行, 平台标签独占底部整行(单行, 永不折行),
       标题/日期与封面上沿对齐, 标签行即卡片底部(评分块仍对齐标签行) */
    #body .item{display:grid; grid-template-columns:150px 1fr; grid-template-rows:auto 1fr auto;
         column-gap:16px; row-gap:2px; align-items:start;}   /* 行高: 标题紧凑, 日期紧随其下, 富余高度全归日期行 */
    #body .item .pic{grid-column:1; grid-row:1 / 3;}
    #body .item .txt{display:contents;}
    #body .item .tline{grid-column:2; grid-row:1;}
    #body .item .tag{grid-column:2; grid-row:2;}
    #body .item .plats{grid-column:1 / -1; grid-row:3; margin-top:8px;}
  }
  @media (max-width:360px){
    h1{font-size:13.5px; letter-spacing:.01em;}
  }
  /* 方案 A demo: 游戏改成目录行。电影海报墙沿用上面的卡片。 */
  #body .list{gap:14px;}
  #body .item{align-items:stretch; gap:22px; padding:16px 22px 16px 16px;}
  #body .item .pic{flex-basis:256px; width:256px; height:128px;}
  #body .txt{justify-content:flex-start; gap:8px;}
  /* 两位数改用同高的等宽数字, 避免 2 和 6 一高一低 */
  #body .fine,
  #body .txt .when,
  #body .item .chip{font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;}
  #body .txt .when,

       font-size:15px; font-weight:600; letter-spacing:0; line-height:1;}
  html.dark #body .txt .when.today,
  html.dark #body .txt .when.out{background:none;}
  #body .txt .tline{align-items:center; gap:16px;}
  #body .txt .tline .t{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;
       font-size:22px; font-weight:700; letter-spacing:0; line-height:1.15;
       font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1;}
  #body .gscore{position:absolute; right:22px; bottom:18px; margin:0; text-decoration:none;

<script>
const $ = s => document.querySelector(s);

/* 夜间模式切换(iOS 开关样式, 状态由 CSS html.dark 驱动) */
(function(){
  const btn = document.getElementById('themeBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const dark = document.documentElement.classList.toggle('dark');
    try{ localStorage.setItem('glwTheme', dark ? 'dark' : 'light'); }catch(e){}
  });
})();
const PALS = [['#0071e3','#0a58a5'],['#af52de','#6d2fa8'],['#ff375f','#b0183a'],
  ['#34c759','#1e7a3e'],['#ff9f0a','#b26a00'],['#5e5ce6','#3634a8'],
  ['#ff6482','#a81d3a'],['#30b0c7','#1a6a78']];
const today = new Date();
/* 平台官方矢量 logo(simple-icons, CC0): 内联避免外部请求, 颜色跟随标签文字 */
const PICONS = {
  steam: '<svg class="pi" viewBox="0 0 24 24"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/></svg>',
  ps: '<svg class="pi" viewBox="0 0 24 24"><path d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.04 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/></svg>',
  ns: '<svg class="pi" viewBox="0 0 24 24"><path d="M14.176 24h3.674c3.376 0 6.15-2.774 6.15-6.15V6.15C24 2.775 21.226 0 17.85 0H14.1c-.074 0-.15.074-.15.15v23.7c-.001.076.075.15.226.15zm4.574-13.199c1.351 0 2.399 1.125 2.399 2.398 0 1.352-1.125 2.4-2.399 2.4-1.35 0-2.4-1.049-2.4-2.4-.075-1.349 1.05-2.398 2.4-2.398zM11.4 0H6.15C2.775 0 0 2.775 0 6.15v11.7C0 21.226 2.775 24 6.15 24h5.25c.074 0 .15-.074.15-.149V.15c.001-.076-.075-.15-.15-.15zM9.676 22.051H6.15c-2.326 0-4.201-1.875-4.201-4.201V6.15c0-2.326 1.875-4.201 4.201-4.201H9.6l.076 20.102zM3.75 7.199c0 1.275.975 2.25 2.25 2.25s2.25-.975 2.25-2.25c0-1.273-.975-2.25-2.25-2.25s-2.25.977-2.25 2.25z"/></svg>'
};
function phColor(t){ let h=0; for(const c of t) h=(h*31+c.codePointAt(0))>>>0;
  const [a,b]=PALS[h%PALS.length]; return 'linear-gradient(135deg,'+a+','+b+')'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function refresh(){
  $('#errBox').style.display='none';
  try{
    const r = await fetch('releases.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
  }catch(e){
    $('#errBox').textContent='获取失败：'+e.message;
    $('#errBox').style.display='block';
    showCredit();
    hideBoot();
  }
}

function moveGlider(tabsEl, btn, instant){
  const g = tabsEl.querySelector('.tabg');
  if(!g || !btn) return;
  if(instant) g.style.transition = 'none';     // 首次/恢复定位: 不要滑动过程
  g.style.width = btn.offsetWidth + 'px';
  g.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
  if(instant){ void g.offsetWidth; g.style.transition = ''; }
}

/* 通用: 月份页签 + 交叉重叠过渡; panels = [{body, groups, makeCard, unit, footFn}]
   一份页签可同时控制多个 panel(游戏/电影各自的列表), 切月时两边同步 */
function tabbed(tabsEl, panels){
  tabsEl.innerHTML = '<span class="tabg"></span>';  // 滑块层
  const tabKey = 'glwTab_' + (tabsEl.id || 'x');
  const groups = panels[0].groups;
  const monthKey = g => g.year + '-' + String(g.month).padStart(2, '0');
  const currentKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0');
  const currentIdx = Math.max(0, groups.findIndex(g=>monthKey(g)===currentKey));
  let savedMonth = '';
  try { savedMonth = localStorage.getItem(tabKey + '_month') || ''; } catch(e) {}
  const savedIdx = groups.findIndex(g=>monthKey(g)===savedMonth);
  let curIdx = savedIdx >= 0 ? savedIdx : currentIdx;

  panels.forEach(p=>{
    p.body.innerHTML = '';
    const pagesEl = document.createElement('div'); pagesEl.className='pages';
    p.pagesEl = pagesEl; p.sections = [];
    p.groups.forEach((g,i)=>{
      const items = g.games || g.movies || g.albums || [];
      const sect = document.createElement('div');
      sect.className = 'sect page' + (i===curIdx ? ' on' : '');
      const list = document.createElement('div'); list.className='list' + (p.grid?' mgrid':'');
      if(!items.length) list.innerHTML='<div class="empty">'+esc(p.emptyText || '该月暂无已定档')+'</div>';
      else items.forEach(it=>list.appendChild(p.makeCard(it)));
      sect.appendChild(list);
      const ft = document.createElement('div'); ft.className = 'pfoot';
      ft.textContent = p.footFn ? p.footFn(g, items) : '';
      sect.appendChild(ft);
      const cr = document.createElement('div'); cr.className = 'credit'; cr.textContent = '@torge';
      sect.appendChild(cr);
      pagesEl.appendChild(sect); p.sections.push(sect);
    });
    p.body.appendChild(pagesEl);
    p.sections.forEach((section,i)=>{ if(i!==curIdx) section.classList.add('off'); });
    p.fit = ()=>{ if(p.holdH) return; if(p.sections[curIdx]) p.pagesEl.style.height = p.sections[curIdx].offsetHeight + 'px'; };
    p.fit();
  });

  const fitAll = ()=> panels.forEach(p=>p.fit());
  /* 按 panel 实际显示的页来切(各 panel 可能因重置时机不同而暂时不同步) */
  const applyIdx = (p, i, animate)=>{
    const onIdx = p.sections.findIndex(s=>s.classList.contains('on'));
    const pCur = onIdx >= 0 ? onIdx : 0;
    if(pCur === i) return;
    const cur = p.sections[pCur], nxt = p.sections[i];
    if(!cur || !nxt) return;
    if(animate){
      /* 动画期间容器按两页里更高的那页撑住: 否则高度立即缩到新页, 旧页多出的部分会被 .pages 的
         overflow:hidden 直接切掉(表现为"一部分内容没有动效就消失")。640ms 后再收敛到新页高度。 */
      const h = Math.max(cur.offsetHeight, nxt.offsetHeight);
      p.holdH = h; p.pagesEl.style.height = h + 'px';
      clearTimeout(p.holdT);
      p.holdT = setTimeout(()=>{ p.holdH = 0; p.fit(); stackFit(); }, 640);
      animSwap(cur, nxt, i > pCur);
    } else {
      PAGE_CLASSES.forEach(c=>{ cur.classList.remove(c); nxt.classList.remove(c); });
      cur.classList.add('off');
      nxt.classList.add('on');
    }
  };
  const switchTo = (i, animate, opts)=>{
    opts = opts || {};
    if(opts.onlyBody){
      /* 只把某个视图的列表归位(不碰月签/记忆/别的视图), 用于切视图后旧视图的延迟归位 */
      const p = panels.find(x=>x.body === opts.onlyBody);
      if(p) applyIdx(p, i, false);
      fitAll();
      return;
    }
    if(i === curIdx && !opts.force) return;
    if(animate === undefined) animate = true;
    panels.forEach(p=>{
      if(opts.skipBody && p.body === opts.skipBody) return;   // 正在淡出的视图先不动(否则会闪现)
      applyIdx(p, i, animate);
    });
    curIdx = i;
    const mhMn = document.getElementById('mhMn'), mhMy = document.getElementById('mhMy');   /* 固定月份标题: 瞬时换字, 不参与交叉动画(避免大号衬线数字叠字) */
    if(mhMn) mhMn.textContent = String(groups[i].month).padStart(2,'0');
    if(mhMy) mhMy.textContent = groups[i].year;
    try { localStorage.setItem(tabKey + '_month', monthKey(groups[i])); } catch(e) {}
    fitAll();
    stackFit();
    tabsEl.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on', j===i));
    /* 滑块: 正常切换有动画; 静默归位默认瞬移, 但 opts.glide 时仍平滑滑动(视图切换时月份从下月回到本月) */
    const actBtn = tabsEl.querySelectorAll('.tab')[i];
    moveGlider(tabsEl, actBtn, !animate && !opts.glide);
    /* 窄屏页签多到溢出时, 把当前页签滚动居中(scroll-behavior:smooth 负责平滑) */
    if(actBtn && tabsEl.scrollWidth > tabsEl.clientWidth + 1){
      const x = actBtn.offsetLeft - (tabsEl.clientWidth - actBtn.offsetWidth)/2;
      tabsEl.scrollTo({left: Math.max(0, x), behavior: (!animate && !opts.glide) ? 'auto' : 'smooth'});
    }
  };

  /* 供顶层视图切换时把月份重置回「本月」: skipBody 跳过正在淡出的视图; force 用于动画后再补一次 */
  window['_resetMonth_' + (tabsEl.id || 'x')] = (opts)=> switchTo(currentIdx, false, opts);

  panels[0].groups.forEach((g,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===curIdx ? ' on' : '');
    const relativeMonth = (g.year-today.getFullYear())*12 + g.month-(today.getMonth()+1);
    const monthLabel = ({'-1':'上月','0':'本月','1':'下月'})[relativeMonth] || (g.year+'年');
    btn.textContent = monthLabel;   /* 具体月份由下方大标题显示, 页签只标相对位置(不再重复) */
    btn.addEventListener('click', ()=>switchTo(i));
    tabsEl.appendChild(btn);
  });

  const fitKey = '_fit_' + (tabsEl.id || 'x');
  if(window[fitKey]) window.removeEventListener('resize', window[fitKey]);
  window[fitKey] = fitAll;
  window.addEventListener('resize', fitAll);
  moveGlider(tabsEl, tabsEl.querySelectorAll('.tab')[curIdx], true);   // 恢复定位不滑动
  const initBtn = tabsEl.querySelectorAll('.tab')[curIdx];
  if(initBtn && tabsEl.scrollWidth > tabsEl.clientWidth + 1){   // 恢复时若页签溢出, 瞬时居中当前月
    tabsEl.scrollLeft = Math.max(0, initBtn.offsetLeft - (tabsEl.clientWidth - initBtn.offsetWidth)/2);
  }
  const mhMn0 = document.getElementById('mhMn'), mhMy0 = document.getElementById('mhMy');
  if(mhMn0) mhMn0.textContent = String(groups[curIdx].month).padStart(2,'0');
  if(mhMy0) mhMy0.textContent = groups[curIdx].year;
  return fitAll;
}

function showCredit(){
  const c = document.querySelector('.credit');
  if(c) c.classList.add('show');
}

/* 数据就位后淡出启动遮罩 */
function hideBoot(){
  const b = document.getElementById('boot');
  if(b) setTimeout(()=>b.classList.add('hide'), 60);
}

let holdStackH = 0, stackHT = null;   // 视图切换动画期间锁住容器高度(避免旧视图被提前裁掉)
function stackFit(){
  if(holdStackH) return;
  const stack = document.getElementById('viewStack');
  if(!stack) return;
  /* 只认直接子视图, 不能用 querySelector('.page.on')——会误命中嵌套的子页签页(viewGame/viewMovie 内部) */
  const on = Array.from(stack.children).find(el=>el.classList.contains('on'));
  if(!on) return;
  stack.style.height = on.offsetHeight + 'px';   // 瞬时, 不做高度动画
}

const PAGE_CLASSES = ['on','off','pre-r','pre-l','out-l','out-r','anim-in-r','anim-in-l','anim-out-l','anim-out-r'];

/* 交叉重叠过渡: 旧页出场 + 新页进场(都用 keyframes, 每次强制重播) */
function animSwap(cur, nxt, forward){
  cur.classList.remove(...PAGE_CLASSES);
  void cur.offsetWidth;                                  // 强制回流, 保证动画重播
  cur.classList.add(forward ? 'anim-out-l' : 'anim-out-r');
  nxt.classList.remove(...PAGE_CLASSES);
  void nxt.offsetWidth;
  nxt.classList.add(forward ? 'anim-in-r' : 'anim-in-l');
  nxt.classList.add('on');
}

/* 评分块纵向对齐: 默认与封面底对齐; 平台标签换行(手机端)时与最后一行标签对齐 */
function alignMc(){
  document.querySelectorAll('.item').forEach(it=>{
    const box = it.querySelector('.mcbox');
    if(!box || it.classList.contains('pc')) return;   /* 海报卡的评分块固定在海报右上角, 不参与底对齐 */
    const ir = it.getBoundingClientRect();
    const cands = [];
    const pic = it.querySelector('.pic');
    const plats = it.querySelector('.plats');
    if(pic) cands.push(pic.getBoundingClientRect().bottom);
    if(plats && plats.children.length) cands.push(plats.getBoundingClientRect().bottom);
    if(!cands.length) return;
    const ref = Math.max.apply(null, cands);    // 取更靠下的参照 = 平台标签换行时对齐最后一行
    const gap = Math.round(ir.bottom - ref);
    if(gap >= 0 && gap < 300) box.style.bottom = gap + 'px';
  });
}

let state = { game: null, movie: null, music: null };
let curViewName = 'game';   // 当前顶层视图, 由下面的视图切换 IIFE 维护

/* 页头更新时间按当前视图分别显示: 游戏页看 releases.json, 电影页看 movies.json(各自数据缺失时回退另一边) */
function paintUp(){
  const mhUp = document.getElementById('mhUp');
  if(!mhUp) return;
  const cur = curViewName==='movie' ? state.movie : state.game;
  const other = curViewName==='movie' ? state.game : state.movie;
  const upd = (cur && cur.updated) || (other && other.updated) || '';
  mhUp.textContent = upd ? '更新于 ' + upd.slice(5, 16) : '';   /* "2026-10-04 23:14:28" -> "10-04 23:14" */
}

/* 两份数据任一到位就重建(月签只有一份, 同时控制两边列表) */
function paint(){
  const panels = [];
  if(state.game) panels.push({
    body: $('#body'), groups: state.game.groups || [], makeCard: card, unit: '款',
    footFn: g => '共 ' + g.games.length + ' 款 · 评分来自 Metacritic · 每月初自动更新'
  });
  if(state.movie) panels.push({
    body: $('#movieBody'), groups: state.movie.groups || [], makeCard: mcard, unit: '部', grid: true,
    footFn: g => '共 ' + g.movies.length + ' 部 · 评分来自豆瓣 · 每月初自动更新'
  });
  if(!panels.length) return;
  tabbed($('#tabs'), panels);
  paintUp();
  showCredit();
  stackFit();
  alignMc();
  hideBoot();
}

function render(d){
  state.game = d;
  paint();
}

function card(it){
  const wrap = document.createElement('div'); wrap.className='item';
  const isToday = it.day===today.getDate() && it.month===today.getMonth()+1 && it.year===today.getFullYear();
  if(isToday) wrap.classList.add('today');
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt, whenCls;
  if(diff===0){ whenTxt='今天发售'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天发售'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有 '+diff+' 天'; whenCls='soon'; }
  else { whenTxt='已发售'; whenCls='out'; }
  const whenTag = '<span class="when '+whenCls+'">'+whenTxt+'</span>';
  const pl = it.plats||[];
  /* 封面优先横版图源; 候选链全部列出, 加载失败自动换下一张 */
  const cand = [];
  if(it.cover_img) cand.push(it.cover_img);
  ['steam','ns','ps'].forEach(k=>{ const p=pl.find(x=>x.key===k); if(p&&p.img) cand.push(p.img); });
  const imgUrl = cand[0] || '';
  const candJson = JSON.stringify(cand).replace(/'/g, "&#39;");
  const imgTag = imgUrl
    ? '<img class="cover" src="'+esc(imgUrl)+'" alt="" loading="lazy" data-cand="'+candJson+'" onerror="cf(this)" onload="ckw(this)">'
    : '';
  const chips = pl.map(p=>{
    const pv = p.price;
    let pfmt = '';
    if (pv!=null && pv!==false && pv!=='') {
      const n = Number(pv);
      pfmt = (n % 1 === 0) ? String(n) : n.toFixed(2);
      pfmt = (p.key==='steam' ? '¥'+pfmt : 'HK$'+pfmt);
    }
    const url = p.url ? 'href="'+esc(p.url)+'" target="_blank" rel="noopener"' : '';
    const pm = (p.key==='steam'?'st':p.key);
    return '<a class="chip '+pm+'" '+url+' aria-label="'+esc(p.name+(pfmt?' '+pfmt:''))+'">'+(PICONS[p.key]||'')+
      (pfmt?pfmt:'')+'</a>';
  }).join('');
  const mc = (typeof it.mc==='number' && it.mc>0) ? it.mc : null;
  const scoreCls = mc==null ? '' : (mc>=80?'g':(mc>=60?'y':'r'));
  const score = mc ? '<a class="gscore '+scoreCls+'" href="'+esc(it.mc_url||'https://www.metacritic.com/')+'" target="_blank" rel="noopener" aria-label="Metacritic '+mc+'">'+mc+'</a>' : '';
  const fine = '<span>'+it.month+'月'+it.day+'日</span>'+(it.dev?'<span class="sep">·</span><span>'+esc(it.dev)+'</span>':'');
  wrap.innerHTML =
    '<div class="pic">'+imgTag+
      '<div class="ph" style="background:'+phColor(it.title)+(imgUrl?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div></div>'+
      '<div class="fine">'+fine+'</div>'+
      whenTag+
      (chips?'<div class="plats">'+chips+'</div>':'')+
      score+
    '</div>';
  wrap.querySelector('.t').textContent = it.title;   /* 游戏名纯文本: 商店跳转靠下面的平台标签 */
  return wrap;
}

function firstChar(t){ t=(t||'').trim(); return t?Array.from(t)[0]:'?'; }

/* 封面多级兜底: 当前图加载失败 -> 依次试候选链中下一张 -> 全失败显示首字占位 */
function cf(img){
  const cand = JSON.parse(img.dataset.cand || '[]');
  const idx = cand.indexOf(img.src);
  const next = cand[idx + 1];
  if(next){ img.src = next; return; }
  img.style.display='none';
  const ph = img.parentNode && img.parentNode.querySelector('.ph');
  if(ph) ph.style.display='flex';
}

/* 超宽图(比例>2.35)切 contain 完整显示, 避免横幅被裁 */
function ckw(img){
  try{
    if(img.naturalWidth && img.naturalHeight && img.naturalWidth/img.naturalHeight > 2.35){
      img.classList.add('wide');
    }
  }catch(e){}
}

/* ---------- 电影(豆瓣) ---------- */
function minfoParts(s){
  const p = String(s||'').split('/').map(x=>x.trim()).filter(Boolean);
  return { region: p[1] || '', kind: p[2] || '', director: p[3] || '' };   // 副标题: 年份/地区/类型/导演/主演
}

function minfo(s){
  const p = String(s||'').split('/').map(x=>x.trim()).filter(Boolean);
  return p.slice(1,4).join(' · ');
}

function mcard(it){
  const wrap = document.createElement('div'); wrap.className='item mv pc';
  const sc = (typeof it.score==='number' && it.score>0) ? it.score : null;
  if(it.day===today.getDate() && it.month===today.getMonth()+1) wrap.classList.add('today');
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt='', whenCls='';
  if(diff===0){ whenTxt='今天上映'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天上映'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有 '+diff+' 天'; whenCls='soon'; }
  else { whenTxt='已上映'; whenCls='out'; }
  const whenTag = whenCls ? '<span class="when '+whenCls+'">'+whenTxt+'</span>' : '';
  const img = it.poster
    ? '<img class="cover" src="'+esc(it.poster)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  /* 豆瓣 10 分制 ×10 显示(与游戏 Metacritic 同为百分制): ≥80 绿 / ≥60 黄 / <60 红, 整块跳豆瓣条目页 */
  const mc = sc!=null ? '<a class="mcbox '+(sc>=8?'g':(sc>=6?'y':'r'))+'" href="'+esc(it.url||'https://movie.douban.com/')+
      '" target="_blank" rel="noopener">'+
      '<span class="mcv">'+Math.round(sc*10)+'</span></a>' : '';
  const mi = minfoParts(it.info);
  const line2 = '<span>'+it.month+'月'+it.day+'日'+(mi.region?' · '+esc(mi.region):'')+'</span>';  /* 第三行: 优先条目接口的准确类型; 回退副标题第 3 段仅在结构完整(年/地区/类型/导演/演员共 5 段)时可信;
     否则可能把导演名当类型(如"渔村之恋") → 留空 */
  const parts = String(it.info||'').split('/').map(s=>s.trim()).filter(Boolean);
  const genres = (it.genres && it.genres.length)
    ? it.genres.join(' ')
    : (parts.length >= 5 ? (parts[2] || '') : '');
  const line3 = genres;
  wrap.innerHTML =
    '<div class="pic m">'+img+
      '<div class="ph" style="background:'+phColor(it.title)+(it.poster?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
      whenTag+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline"><div class="t"></div></div>'+
      '<div class="tag">'+line2+'</div>'+
      (line3?'<div class="tag tag3"><span>'+esc(line3)+'</span></div>':'')+
    '</div>'+mc;
  wrap.querySelector('.t').textContent = it.title;   /* 电影名纯文本: 跳转只走评分块 */
  return wrap;
}

function renderMovies(d){
  state.movie = d;
  paint();
}

let moviesLoaded = false;
async function refreshMovies(){
  if(moviesLoaded) return;
  const box = $('#mErrBox');
  box.style.display='none';
  try{
    const r = await fetch('movies.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    renderMovies(d);
    moviesLoaded = true;
  }catch(e){
    box.textContent='获取失败：'+e.message;
    box.style.display='block';
  }
}

/* ---------- 音乐(Apple Music + Metacritic) ---------- */
function mucard(it){
  const wrap = document.createElement('div'); wrap.className='item mv';
  const sc = (typeof it.score==='number' && it.score>0) ? it.score : null;
  if(it.day===today.getDate() && it.month===today.getMonth()+1) wrap.classList.add('today');
  const date = new Date(it.year, it.month-1, it.day);
  const diff = Math.round((date - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let whenTxt='', whenCls='';
  if(diff===0){ whenTxt='今天发行'; whenCls='today'; }
  else if(diff===1){ whenTxt='明天发行'; whenCls='today'; }
  else if(diff>1){ whenTxt='还有 '+diff+' 天'; whenCls='soon'; }
  else { whenTxt='已发行'; whenCls='out'; }
  const whenTag = whenCls ? '<span class="when '+whenCls+'">'+whenTxt+'</span>' : '';
  const img = it.art ? '<img class="cover" src="'+esc(it.art)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  /* Metacritic 专业均分(百分制): ≥80 绿 / ≥60 黄 / <60 红 */
  const mcBox = sc!=null ? '<a class="mcbox '+(sc>=80?'g':(sc>=60?'y':'r'))+'" href="'+esc(it.score_url||'https://pitchfork.com/reviews/albums/')+
      '" target="_blank" rel="noopener">'+
      '<span class="mcv">'+sc+'</span></a>' : '';
  const line2 = '<span>'+esc(it.artist||'')+'</span>';
  const line3 = [it.kind||it.genre||'', it.date? ((+it.date.slice(5,7))+'月'+(+it.date.slice(8,10))+'日') : ''].filter(Boolean).join(' · ');
  /* 专辑名不加超链接(用户要求) */
  wrap.innerHTML =
    '<div class="pic sq">'+img+
      '<div class="ph" style="background:'+phColor(it.title)+(it.art?';display:none':'')+'">'+esc(firstChar(it.title))+'</div>'+
    '</div>'+
    '<div class="txt">'+
      '<div class="tline'+(whenTag?' haswhen':'')+'"><div class="t"></div>'+whenTag+'</div>'+
      '<div class="tag">'+line2+'</div>'+
      (line3?'<div class="tag tag3"><span>'+esc(line3)+'</span></div>':'')+
    '</div>'+mcBox;
  const t = wrap.querySelector('.t');
  t.textContent = it.title;
  return wrap;
}

function renderMusic(d){
  state.music = d;
  paint();
}

let musicLoaded = false;
async function refreshMusic(){
  if(musicLoaded) return;
  const box = $('#muErrBox');
  box.style.display='none';
  try{
    const r = await fetch('music.json'); const d = await r.json();
    if(d.error) throw new Error(d.error);
    renderMusic(d);
    musicLoaded = true;
  }catch(e){
    box.textContent='获取失败：'+e.message;
    box.style.display='block';
  }
}

/* 顶层切换: 游戏 / 电影 / 音乐 (交叉重叠过渡, 与本月/下月页签同款; 记住上次视图) */
(function(){
  const top = document.getElementById('topTabs');
  if(!top) return;
  const btns = Array.from(top.querySelectorAll('.tab'));
  const g = document.getElementById('viewGame'), m = document.getElementById('viewMovie');
  let curView = 'game';

  const VIEWS = ['game', 'movie'];   // 音乐页签已按用户要求下线(相关代码保留, 需要时把 music 加回来即可)
  const viewEl = { game: g, movie: m };
  function setView(v, animate){
    if(v === curView || VIEWS.indexOf(v) < 0) return;
    const forward = VIEWS.indexOf(v) > VIEWS.indexOf(curView);
    const cur = viewEl[curView], nxt = viewEl[v];
    if(animate){
      const stackEl = document.getElementById('viewStack');
      const hh = Math.max(cur.offsetHeight, nxt.offsetHeight);
      holdStackH = hh;
      if(stackEl) stackEl.style.height = hh + 'px';
      clearTimeout(stackHT);
      stackHT = setTimeout(()=>{ holdStackH = 0; stackFit(); }, 640);
      animSwap(cur, nxt, forward);          // 旧视图先脱离文档流, 两视图都走 keyframes 动画
      /* 月份重置: 新视图立即归位(它刚从透明淡入, 看不到); 旧视图正在淡出, 等动画结束再归位(否则会闪出"本月"列表) */
      const BODY_ID = { game: 'body', movie: 'movieBody' };
      const oldBody = document.getElementById(BODY_ID[curView]);   // 旧视图的列表容器(月签重置时要跳过它)
      if(window['_resetMonth_tabs']) window['_resetMonth_tabs']({ skipBody: oldBody, glide: true });
      setTimeout(()=>{ if(window['_resetMonth_tabs']) window['_resetMonth_tabs']({ onlyBody: oldBody }); }, 700);
    } else {
      PAGE_CLASSES.forEach(c=>{ cur.classList.remove(c); nxt.classList.remove(c); });
      nxt.classList.add('on');
      cur.classList.add('off');          // 静态隐藏(无动画), 刷新恢复时不会补播淡出
    }
    curView = v;
    curViewName = v; paintUp();   // 更新时间随视图切换(游戏/电影各自的时间戳)
    btns.forEach(b=>b.classList.toggle('on', b.dataset.view === v));
    const curBtn = btns.find(b=>b.dataset.view === v);
    if(curBtn) moveGlider(top, curBtn);
    if(v === 'movie') refreshMovies();
    /* 直接用新视图高度(切换瞬间它可能还没拿到 on), 高度瞬时调整 */
    const stack = document.getElementById('viewStack');
    if(stack) stack.style.height = nxt.offsetHeight + 'px';
    if(window['_fit_tabs']) window['_fit_tabs']();
    try { localStorage.setItem('glwView', v); } catch(e) {}
  }

  btns.forEach(btn=>btn.addEventListener('click', ()=>setView(btn.dataset.view, true)));

  let saved = 'game';
  try { saved = localStorage.getItem('glwView') || 'game'; } catch(e) {}
  if(saved === 'movie' || saved === 'music') setView(saved, false);   // 恢复上次视图(无动画, 三个视图都要认)
  moveGlider(top, top.querySelector('.tab.on') || btns[0], true);   // 恢复定位不滑动
  window.addEventListener('resize', stackFit);
  window.addEventListener('resize', alignMc);
  stackFit();
})();

window.addEventListener('load', ()=>{ alignMc(); stackFit(); });   // 字体/图片就位后重算布局对齐
refresh();
refreshMovies();   // 预渲染电影视图: 首次切换时高度已就位, 避免"先塌后撑"的下沉
</script>
