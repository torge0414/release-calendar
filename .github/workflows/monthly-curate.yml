name: Monthly curation (Kimi Code agent)

on:
  schedule:
    # 每月 1 日 09:00 北京时间 (UTC+8) = 01:00 UTC
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-calendar-monthly
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight check
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::缺少 MOONSHOT_API_KEY secret。请在仓库 Settings → Secrets and variables → Actions 中添加(月之暗面开放平台的 API Key)。"
            exit 1
          fi
        env:
          API_KEY: ${{ secrets.MOONSHOT_API_KEY }}

      - name: Install Kimi Code CLI
        run: |
          npm install -g @moonshot-ai/kimi-code
          kimi --version

      - name: Configure optional web search/fetch services
        env:
          S_URL: ${{ secrets.KIMI_WEB_SEARCH_BASE_URL }}
          S_KEY: ${{ secrets.KIMI_WEB_SEARCH_API_KEY }}
          F_URL: ${{ secrets.KIMI_WEB_FETCH_BASE_URL }}
          F_KEY: ${{ secrets.KIMI_WEB_FETCH_API_KEY }}
        run: |
          [ -n "$S_URL" ] && echo "KIMI_WEB_SEARCH_BASE_URL=$S_URL" >> "$GITHUB_ENV"
          [ -n "$S_KEY" ] && echo "KIMI_WEB_SEARCH_API_KEY=$S_KEY" >> "$GITHUB_ENV"
          [ -n "$F_URL" ] && echo "KIMI_WEB_FETCH_BASE_URL=$F_URL" >> "$GITHUB_ENV"
          [ -n "$F_KEY" ] && echo "KIMI_WEB_FETCH_API_KEY=$F_KEY" >> "$GITHUB_ENV"
          true

      - name: Validate existing data
        run: python scripts/check_data.py

      - name: Run monthly curation agent
        env:
          KIMI_MODEL_NAME: ${{ vars.KIMI_MODEL_NAME || 'kimi-k3' }}
          KIMI_MODEL_PROVIDER_TYPE: openai
          KIMI_MODEL_BASE_URL: ${{ vars.KIMI_MODEL_BASE_URL || 'https://api.moonshot.cn/v1' }}
          KIMI_MODEL_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_MODEL_MAX_CONTEXT_SIZE: ${{ vars.KIMI_MODEL_MAX_CONTEXT_SIZE || '1048576' }}
          KIMI_MODEL_CAPABILITIES: tool_use
        run: kimi -p "$(cat .github/monthly-task-prompt.md)"

      - name: Validate updated data and run tests
        run: |
          python scripts/check_data.py
          python scripts/test_calendar.py
          node scripts/test_game_cover.js
          node scripts/test_month_tabs.js

      - name: Commit only actual changes
        id: commit
        run: |
          git add releases.json movies.json img
          if git diff --cached --quiet; then
            echo "No content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "月度精选重整: 滚动上月/本月/下月窗口"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages deployment
        if: steps.commit.outputs.changed == 'true'
        run: |
          want=$(sha256sum releases.json | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -s "https://torge0414.github.io/release-calendar/releases.json?nocache=$i$RANDOM" | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "Pages deployment confirmed."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Pages 部署未在预期时间内确认, 请手动检查线上内容。"
