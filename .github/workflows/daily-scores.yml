name: Daily score update

on:
  schedule:
    # 18:00 China Standard Time (UTC+8)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-calendar-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing data
        run: python scripts/check_data.py
      - name: Refresh existing scores
        run: python scripts/update_scores.py
      - name: Validate updated data
        run: python scripts/check_data.py
      - name: Commit only actual changes
        run: |
          if git diff --quiet -- releases.json movies.json; then
            echo "No score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json movies.json
          git commit -m "自动更新评分"
          git push origin HEAD:main
